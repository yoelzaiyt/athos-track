# Deploy manual do projeto Vercel que NÃO tem Git conectado
# (kleberduartes-projects/athos-track → athos-track-delta.vercel.app), que hoje
# só sai do ar de sincronia porque depende de alguém rodar `vercel --prod` na
# mão.
#
# Não roda em push de propósito. O outro projeto Vercel
# (yoelzaiyts-projects/athos-track) já está conectado ao repo e publica o
# `master` sozinho — um deploy automático aqui duplicaria aquele.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — token pessoal em vercel.com/account/tokens
#   VERCEL_ORG_ID      — de .vercel/project.json após `vercel link`
#   VERCEL_PROJECT_ID  — idem
# Sem os três o job para com uma mensagem clara, em vez de falhar no meio.

name: Deploy (Vercel, manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Alvo do deploy'
        required: true
        default: preview
        type: choice
        options: [preview, production]

concurrency:
  group: deploy-vercel-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Conferir os secrets antes de começar
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Secrets faltando:$missing — configure em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # O mesmo gate do CI, de novo: um deploy manual não deve poder pular o
      # typecheck só porque alguém clicou no botão.
      - name: Typecheck
        run: npm run lint

      - name: Testes unitários
        run: npm run test:unit

      - name: Instalar a CLI da Vercel
        run: npm i -g vercel@latest

      - name: Puxar a configuração do projeto
        run: |
          vercel pull --yes \
            --environment=${{ github.event.inputs.environment }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deploy: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
